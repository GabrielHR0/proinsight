spring.application.name=proinsight

tabelas.classificacao.cooper-id=classificacao_cooper_12min
tabelas.classificacao.rockport-id=classificacao_rockport_1mile
tabelas.classificacao.aha-id=classificacao_aha_vo2max

spring.data.mongodb.uri=mongodb://root:example@localhost:27017/proinsight_dev?authSource=admin

server.port=8080
management.server.port=8081

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.mongo.enabled=true
management.endpoint.health.enabled=true
logging.level.root=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
spring.mvc.log-request-details=true
logging.file.path=./logs
logging.file.name=proinsight.log