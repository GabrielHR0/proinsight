spring.application.name=proinsight
# Secure default: local must be explicitly activated (SPRING_PROFILES_ACTIVE=local).
spring.profiles.default=prod

# Heroku fornece a porta via variável de ambiente PORT
server.port=${PORT:8080}

# ── MongoDB ──
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://root:example@localhost:27017/proinsight_dev?authSource=admin&replicaSet=rs0}
# Indexes are created explicitly by IndexInitializer. Spring Data auto-index
# creation stays disabled (default) because it can generate names that conflict
# with indexes already managed by the application.

# ── JWT ──
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=proinsight-api
jwt.audience=proinsight-app

tabelas.classificacao.cooper-id=classificacao_cooper_12min
tabelas.classificacao.esteira-incremental-id=classificacao_esteira_incremental
tabelas.classificacao.imc-id=classificacao_imc_oms
tabelas.classificacao.fullerton-sentar-levantar-id=classificacao_fullerton_sentar_levantar
tabelas.classificacao.fullerton-flexao-cotovelo-id=classificacao_fullerton_flexao_cotovelo
tabelas.classificacao.fullerton-marcha-2min-id=classificacao_fullerton_marcha_2min
tabelas.classificacao.fullerton-sentar-alcancar-pes-id=classificacao_fullerton_sentar_alcancar_pes
tabelas.classificacao.fullerton-alcancar-costas-id=classificacao_fullerton_alcancar_costas
tabelas.classificacao.fullerton-levantar-caminhar-id=classificacao_fullerton_levantar_caminhar

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
server.error.include-stacktrace=never
server.error.include-message=never
management.health.mongo.enabled=true
management.endpoint.health.enabled=true
logging.level.root=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
spring.mvc.log-request-details=false

spring.devtools.restart.enabled=false
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.livereload.enabled=false

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# HTTP admission control / backpressure (per application instance).
# Tune these values from the load test results for the deployed CPU/memory size.
app.backpressure.enabled=${BACKPRESSURE_ENABLED:true}
app.backpressure.max-concurrent-requests=${BACKPRESSURE_MAX_CONCURRENT:40}
app.backpressure.queue-capacity=${BACKPRESSURE_QUEUE_CAPACITY:20}
app.backpressure.queue-timeout-ms=${BACKPRESSURE_QUEUE_TIMEOUT_MS:1000}
app.backpressure.auth-max-concurrent-requests=${BACKPRESSURE_AUTH_MAX_CONCURRENT:6}
app.backpressure.auth-queue-capacity=${BACKPRESSURE_AUTH_QUEUE_CAPACITY:4}
app.backpressure.auth-queue-timeout-ms=${BACKPRESSURE_AUTH_QUEUE_TIMEOUT_MS:500}
app.backpressure.retry-after-seconds=${BACKPRESSURE_RETRY_AFTER_SECONDS:2}

# Password reset token delivery (never returned by the HTTP API)
app.password-reset.smtp-host=${MAIL_HOST:}
app.password-reset.smtp-port=${MAIL_PORT:587}
app.password-reset.smtp-username=${MAIL_USERNAME:}
app.password-reset.smtp-password=${MAIL_PASSWORD:}
app.password-reset.smtp-starttls=${MAIL_STARTTLS:true}
app.password-reset.from=${MAIL_FROM:no-reply@proinsight.com}
app.password-reset.reset-url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}