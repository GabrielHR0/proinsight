spring.application.name=proinsight
spring.profiles.default=local

tabelas.classificacao.cooper-id=classificacao_cooper_12min
tabelas.classificacao.rockport-id=classificacao_rockport_1mile
tabelas.classificacao.aha-id=classificacao_aha_vo2max
tabelas.classificacao.esteira-incremental-id=classificacao_esteira_incremental
tabelas.classificacao.imc-id=classificacao_imc_oms

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
server.error.include-stacktrace=never
server.error.include-message=never
management.health.mongo.enabled=true
management.endpoint.health.enabled=true
logging.level.root=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
spring.mvc.log-request-details=false
logging.file.path=./logs
logging.file.name=proinsight.log

spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.livereload.enabled=true

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

jwt.issuer=proinsight-api
jwt.audience=proinsight-app